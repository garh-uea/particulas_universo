<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻 Un regalo para Marleyth</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020403;
        font-family: Georgia, "Times New Roman", serif;
    }

    #escena {
        position: relative;
        width: 100vw;
        height: 100vh;
    }

    #mensaje {
        position: absolute;
        z-index: 5;
        top: 7%;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 850px;
        text-align: center;
        color: #fff7b0;
        opacity: 0;
        transition: opacity 2s ease;
        pointer-events: none;
        text-shadow: 0 0 15px #d99b18;
    }

    #mensaje h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4.5rem);
        letter-spacing: 3px;
    }

    #mensaje p {
        margin: 12px 0 0;
        font-size: clamp(1rem, 2.5vw, 1.4rem);
        color: #ffe991;
    }

    #mensaje.visible {
        opacity: 1;
    }

    #estado {
        position: absolute;
        z-index: 5;
        bottom: 7%;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 239, 156, .75);
        font-size: clamp(.75rem, 2vw, 1rem);
        letter-spacing: 2px;
        text-align: center;
        transition: opacity 1.5s;
    }

    #reiniciar {
        position: absolute;
        z-index: 10;
        right: 20px;
        bottom: 20px;
        border: 1px solid rgba(255, 218, 72, .5);
        border-radius: 20px;
        padding: 9px 15px;
        color: #5b3800;
        background: linear-gradient(#fff09a, #e9ad22);
        cursor: pointer;
        opacity: .75;
    }

    #reiniciar:hover {
        opacity: 1;
    }

    canvas {
        display: block;
    }
</style>
</head>

<body>

<div id="escena">
    <div id="mensaje">
        <h1>🌻 Para Marleyth 🌻</h1>
        <p>Un pequeño detalle para una persona muy especial</p>
    </div>

    <div id="estado">Preparando un pequeño jardín de luz...</div>

    <button id="reiniciar">🌱 Volver a florecer</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

const PARTICULAS = 10000;

let escena;
let camara;
let renderizador;
let sistemaParticulas;

let posiciones;
let colores;
let destinos;
let tipos;
let tamanos;

let tiempoInicio = 0;
let ciclo = 0;


/* =========================================================
   ESCENA 3D
   ========================================================= */

escena = new THREE.Scene();

camara = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camara.position.set(0, 1.2, 11);

renderizador = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderizador.setSize(window.innerWidth, window.innerHeight);

document.getElementById("escena").appendChild(renderizador.domElement);


/* =========================================================
   FONDO
   ========================================================= */

const fondo = new THREE.Color(0x020604);
escena.background = fondo;


/* =========================================================
   DATOS DE PARTÍCULAS
   ========================================================= */

posiciones = new Float32Array(PARTICULAS * 3);
colores = new Float32Array(PARTICULAS * 3);
destinos = new Float32Array(PARTICULAS * 3);
tipos = new Float32Array(PARTICULAS);
tamanos = new Float32Array(PARTICULAS);


/* =========================================================
   FUNCIONES AUXILIARES
   ========================================================= */

function ponerColor(i, r, g, b) {

    colores[i * 3] = r;
    colores[i * 3 + 1] = g;
    colores[i * 3 + 2] = b;
}


function agregarParticula(i, x, y, z, r, g, b, tipo, tamano) {

    destinos[i * 3] = x;
    destinos[i * 3 + 1] = y;
    destinos[i * 3 + 2] = z;

    ponerColor(i, r, g, b);

    tipos[i] = tipo;
    tamanos[i] = tamano;

    /* Las partículas empiezan lejos y desordenadas. */
    const distancia = 7 + Math.random() * 9;
    const angulo = Math.random() * Math.PI * 2;

    posiciones[i * 3] =
        Math.cos(angulo) * distancia;

    posiciones[i * 3 + 1] =
        -4 + Math.random() * 8;

    posiciones[i * 3 + 2] =
        Math.sin(angulo) * distancia;
}


/* =========================================================
   CREAR UN GIRASOL CON PARTÍCULAS
   ========================================================= */

function crearGirasol(indice, cantidad, centroX, centroY, escala) {

    let usados = 0;
    const tallo = Math.floor(cantidad * 0.12);
    const hojas = Math.floor(cantidad * 0.16);
    const petalos = Math.floor(cantidad * 0.50);
    const centro = cantidad - tallo - hojas - petalos;
    const aureo = Math.PI * (3 - Math.sqrt(5));

    /* Escala uniforme exclusiva de las flores: conserva su silueta
       y las posiciones relativas del ramo en pantallas estrechas. */
    const escalaPantalla = () => Math.min(
        1, (2 * 9.9 * Math.tan(Math.PI / 6) *
            window.innerWidth / Math.max(window.innerHeight, 1)) / 9.2
    );
    let ajuste = escalaPantalla();
    const punto = (x, y, z, r, g, b, tipo, tamano) => {
        agregarParticula(indice + usados++, x * ajuste,
            1.2 + (y - 1.2) * ajuste, z,
            r, g, b, tipo, tamano);
    };
    const ejeTallo = t => centroX + Math.sin(t * Math.PI) * 0.09 * escala;

    /* Tallo fino con volumen, unido al centro de la corola. */
    for (let j = 0; j < tallo; j++) {
        const t = j / Math.max(tallo - 1, 1);
        const a = j * aureo;
        const grosor = (0.027 + 0.012 * (1 - t)) * escala;
        punto(ejeTallo(t) + Math.cos(a) * grosor,
            -3.8 + t * (centroY + 3.8),
            0.38 + Math.sin(a) * grosor,
            0.12, 0.38 + 0.16 * t, 0.055, 1, 0.035);
    }

    /* Dos hojas lanceoladas: extremos cerrados y nervadura curva. */
    for (let j = 0; j < hojas; j++) {
        const lado = j % 2 === 0 ? -1 : 1;
        const k = Math.floor(j / 2);
        const n = Math.ceil((hojas - (j % 2)) / 2);
        const t = (k + 0.5) / n;
        const transversal = 2 * ((k * 0.61803398875) % 1) - 1;
        const ancho = 0.25 * Math.pow(Math.sin(Math.PI * t), 0.9);
        const base = lado < 0 ? 0.39 : 0.58;
        const avance = 0.94 * t;
        const subida = 0.46 * t + 0.10 * Math.sin(Math.PI * t);
        const borde = ancho * transversal;
        punto(ejeTallo(base) + lado * (avance - borde * 0.42) * escala,
            -3.8 + base * (centroY + 3.8) + (subida + borde * 0.90) * escala,
            0.40 + 0.10 * Math.sin(Math.PI * t) * (1 - transversal * transversal) * escala,
            0.12 + 0.06 * (1 - Math.abs(transversal)),
            0.43 + 0.18 * (1 - Math.abs(transversal)), 0.07, 2, 0.04);
    }

    /* Dos coronas alternadas de pétalos con puntas suaves.
       El muestreo regular evita grumos y huecos aleatorios. */
    const numeroPetalos = 18;
    for (let j = 0; j < petalos; j++) {
        const p = j % (numeroPetalos * 2);
        const capa = Math.floor(p / numeroPetalos);
        const k = Math.floor(j / (numeroPetalos * 2));
        const n = Math.floor((petalos - 1 - p) / (numeroPetalos * 2)) + 1;
        const t = (k + 0.5) / n;
        const a = (p % numeroPetalos + capa * 0.5) * Math.PI * 2 / numeroPetalos;
        const transversal = 2 * ((k * 0.61803398875 + p * 0.38196601125) % 1) - 1;
        const largo = capa === 0 ? 0.82 : 0.69;
        const radio = 0.43 + largo * t;
        const ancho = (capa === 0 ? 0.145 : 0.135) *
            Math.pow(Math.sin(Math.PI * t), 0.85);
        const lateral = ancho * transversal;
        const relieve = Math.sin(Math.PI * t);
        punto(centroX + (Math.cos(a) * radio - Math.sin(a) * lateral) * escala,
            centroY + (Math.sin(a) * radio + Math.cos(a) * lateral) * escala,
            0.51 + capa * 0.045 + (0.085 * relieve *
                (1 - transversal * transversal) - 0.045 * t * t) * escala,
            1.0, 0.49 + 0.35 * t + 0.06 * (1 - Math.abs(transversal)),
            0.025 + 0.085 * t, 3, 0.045);
    }

    /* Centro de semillas en espiral, abombado y concéntrico a los pétalos. */
    for (let j = 0; j < centro; j++) {
        const t = Math.sqrt((j + 0.5) / centro);
        const a = j * aureo;
        const radio = 0.47 * t * escala;
        const brillo = 0.5 + 0.5 * Math.sin(j * 2.399963);
        punto(centroX + Math.cos(a) * radio,
            centroY + Math.sin(a) * radio,
            0.65 + 0.12 * (1 - t * t) * escala,
            0.24 + 0.16 * t + 0.06 * brillo,
            0.085 + 0.12 * t + 0.035 * brillo,
            0.018 + 0.02 * t, 4, 0.045);
    }

    window.addEventListener("resize", () => {
        const siguiente = escalaPantalla();
        const proporcion = siguiente / ajuste;
        for (let j = indice; j < indice + usados; j++) {
            destinos[j * 3] *= proporcion;
            destinos[j * 3 + 1] = 1.2 + (destinos[j * 3 + 1] - 1.2) * proporcion;
            posiciones[j * 3] *= proporcion;
            posiciones[j * 3 + 1] = 1.2 + (posiciones[j * 3 + 1] - 1.2) * proporcion;
        }
        ajuste = siguiente;
    });

    return usados;
}


/* =========================================================
   CONSTRUIR EL RAMO
   ========================================================= */

function construirRamo() {

    let indice = 0;

    /*
       Las flores tienen diferentes tamaños y posiciones
       para que parezca un ramo natural.
    */

    const flores = [
        { x: -3.0, y: 1.3, escala: 0.82 },
        { x: -1.8, y: 2.0, escala: 1.00 },
        { x: -0.65, y: 2.55, escala: 1.12 },
        { x: 0.65, y: 2.55, escala: 1.12 },
        { x: 1.85, y: 2.0, escala: 1.00 },
        { x: 3.0, y: 1.25, escala: 0.82 },
        { x: -1.05, y: 1.15, escala: 0.78 },
        { x: 1.05, y: 1.15, escala: 0.78 }
    ];

    const cantidadPorFlor = 1050;

    for (let i = 0; i < flores.length; i++) {

        indice += crearGirasol(
            indice,
            cantidadPorFlor,
            flores[i].x,
            flores[i].y,
            flores[i].escala
        );
    }


    /*
       Si quedan partículas libres,
       se utilizan como pequeños destellos.
    */

    while (indice < PARTICULAS) {

        const angulo = Math.random() * Math.PI * 2;
        const radio = 3 + Math.random() * 5;

        agregarParticula(
            indice,
            Math.cos(angulo) * radio,
            -0.5 + Math.random() * 5,
            Math.sin(angulo) * radio,
            1,
            0.72 + Math.random() * 0.28,
            0.08,
            5,
            0.025
        );

        indice++;
    }
}

construirRamo();


/* =========================================================
   GEOMETRÍA
   ========================================================= */

const geometria = new THREE.BufferGeometry();

geometria.setAttribute(
    "position",
    new THREE.BufferAttribute(posiciones, 3)
);

geometria.setAttribute(
    "color",
    new THREE.BufferAttribute(colores, 3)
);


/* =========================================================
   MATERIAL
   ========================================================= */

const material = new THREE.PointsMaterial({

    size: 0.045,

    vertexColors: true,

    transparent: true,

    opacity: 0.9,

    depthWrite: false,

    blending: THREE.AdditiveBlending
});


sistemaParticulas =
    new THREE.Points(geometria, material);

escena.add(sistemaParticulas);


/* =========================================================
   PARTÍCULAS DE LUZ ALREDEDOR
   ========================================================= */

const luzGeometria =
    new THREE.BufferGeometry();

const luzPosiciones =
    new Float32Array(700 * 3);

for (let i = 0; i < 700; i++) {

    const radio =
        4 + Math.random() * 6;

    const angulo =
        Math.random() * Math.PI * 2;

    luzPosiciones[i * 3] =
        Math.cos(angulo) * radio;

    luzPosiciones[i * 3 + 1] =
        -1 + Math.random() * 8;

    luzPosiciones[i * 3 + 2] =
        Math.sin(angulo) * radio;
}

luzGeometria.setAttribute(
    "position",
    new THREE.BufferAttribute(luzPosiciones, 3)
);

const luzMaterial =
    new THREE.PointsMaterial({

        color: 0xffe875,

        size: 0.035,

        transparent: true,

        opacity: 0.6,

        blending: THREE.AdditiveBlending
    });

const luces =
    new THREE.Points(
        luzGeometria,
        luzMaterial
    );

escena.add(luces);


/* =========================================================
   ANIMACIÓN
   ========================================================= */

function animar() {

    requestAnimationFrame(animar);

    const ahora =
        performance.now();

    const tiempo =
        ahora - tiempoInicio;

    /*
       La formación ocurre en etapas.
    */

    const duracionEntrada = 7000;

    for (let i = 0; i < PARTICULAS; i++) {

        const retraso =
            (i / PARTICULAS) * 4000;

        const progreso =
            THREE.MathUtils.clamp(
                (tiempo - retraso) /
                duracionEntrada,
                0,
                1
            );

        /*
           Movimiento suave hacia la forma
           final del girasol.
        */

        const suavizado =
            progreso * progreso *
            (3 - 2 * progreso);

        const i3 = i * 3;

        const ruido =
            (1 - suavizado) *
            (0.35 + Math.sin(i * 12.7 + tiempo * 0.004) * 0.12);

        posiciones[i3] =
            THREE.MathUtils.lerp(
                posiciones[i3],
                destinos[i3],
                0.018 + suavizado * 0.035
            ) + ruido * 0.08;

        posiciones[i3 + 1] =
            THREE.MathUtils.lerp(
                posiciones[i3 + 1],
                destinos[i3 + 1],
                0.018 + suavizado * 0.035
            );

        posiciones[i3 + 2] =
            THREE.MathUtils.lerp(
                posiciones[i3 + 2],
                destinos[i3 + 2],
                0.018 + suavizado * 0.035
            );
    }

    geometria.attributes.position.needsUpdate = true;


    /*
       Movimiento delicado del ramo.
    */

    sistemaParticulas.rotation.y =
        Math.sin(ahora * 0.00025) * 0.09;

    sistemaParticulas.rotation.x =
        Math.sin(ahora * 0.00018) * 0.025;

    luces.rotation.y =
        ahora * 0.00008;


    /*
       Cuando termina la formación,
       aparece el mensaje.
    */

    if (tiempo > 8500) {

        document
            .getElementById("mensaje")
            .classList.add("visible");

        document
            .getElementById("estado")
            .style.opacity = "0";
    }

    renderizador.render(
        escena,
        camara
    );
}


/* =========================================================
   REINICIAR
   ========================================================= */

function reiniciar() {

    tiempoInicio =
        performance.now();

    document
        .getElementById("mensaje")
        .classList.remove("visible");

    document
        .getElementById("estado")
        .style.opacity = "1";

    /*
       Las partículas vuelven a comenzar
       desde el exterior.
    */

    for (let i = 0; i < PARTICULAS; i++) {

        const distancia =
            7 + Math.random() * 9;

        const angulo =
            Math.random() * Math.PI * 2;

        posiciones[i * 3] =
            Math.cos(angulo) * distancia;

        posiciones[i * 3 + 1] =
            -4 + Math.random() * 8;

        posiciones[i * 3 + 2] =
            Math.sin(angulo) * distancia;
    }

    geometria.attributes.position.needsUpdate = true;
}

document
    .getElementById("reiniciar")
    .addEventListener(
        "click",
        reiniciar
    );


/* =========================================================
   AJUSTE DE VENTANA
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        camara.aspect =
            window.innerWidth /
            window.innerHeight;

        camara.updateProjectionMatrix();

        renderizador.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   INICIO
   ========================================================= */

reiniciar();
animar();

</script>

</body>
</html>
